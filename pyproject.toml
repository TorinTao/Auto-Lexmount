[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-lexmount"
version = "0.1.0"
description = "A small evidence-first hackathon workflow agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["lexmount==0.7.0", "playwright==1.63.0"]

[project.scripts]
autolex = "autolex.cli:main"

[tool.setuptools.packages.find]
include = ["autolex*"]

[tool.setuptools.package-data]
autolex = ["report.css", "web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
