# Install as /etc/systemd/system/autolex.service.d/public-port.conf.
# The gateway owns public port 8766; the backend stays private on port 8767.
[Service]
ExecStart=
ExecStart=/opt/auto-lexmount/current/.venv/bin/python -m autolex --env-file /etc/auto-lexmount/env serve --port 8767 --runs /var/lib/auto-lexmount/runs
