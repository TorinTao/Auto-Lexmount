# Single-port HTTPS entry point when only TCP 8766 is open in the cloud firewall.
user www-data;
worker_processes 1;
pid /run/autolex-gateway.pid;
error_log /var/log/nginx/autolex-error.log;
events { worker_connections 256; }
http {
    access_log /var/log/nginx/autolex-access.log;
    server_tokens off;
    client_max_body_size 64k;
    server {
        listen 8766 ssl default_server;
        server_name 39.106.14.223;
        if ($host != 39.106.14.223) { return 444; }
        ssl_certificate /etc/auto-lexmount/tls/public-ip.crt;
        ssl_certificate_key /etc/auto-lexmount/tls/public-ip.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AutoLexTLS:1m;
        # Also make a plain HTTP visit to this port lead to the HTTPS dashboard.
        error_page 497 =308 https://39.106.14.223:8766$request_uri;
        location / {
            proxy_pass http://127.0.0.1:8767;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }
    }
}
