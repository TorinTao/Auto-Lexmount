# Dedicated gateway: does not load or alter other nginx sites on this host.
user www-data;
worker_processes 1;
pid /run/autolex-gateway.pid;
error_log /var/log/nginx/autolex-error.log;
events { worker_connections 256; }
http {
    access_log /var/log/nginx/autolex-access.log;
    server_tokens off;
    client_max_body_size 64k;
    server {
        listen 80 default_server;
        server_name 39.106.14.223;
        if ($host != 39.106.14.223) { return 444; }
        location /.well-known/acme-challenge/ { root /var/lib/autolex-acme; }
        location / { return 308 https://39.106.14.223$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name 39.106.14.223;
        if ($host != 39.106.14.223) { return 444; }
        ssl_certificate /etc/letsencrypt/live/autolex-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/autolex-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AutoLexTLS:1m;
        auth_basic "Auto Lexmount";
        auth_basic_user_file /etc/nginx/autolex.htpasswd;
        location / {
            proxy_pass http://127.0.0.1:8766;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Preserve Origin: the application validates the configured public origin.
            proxy_read_timeout 30s;
        }
    }
}
